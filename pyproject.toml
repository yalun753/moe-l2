[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "moe-l2"
version = "0.13.1"
description = "MoE inference L2 hot-cache scheduler — run large MoE models on consumer GPUs"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
keywords = ["moe", "mixture-of-experts", "llm", "inference", "caching", "llama.cpp", "host-buffer"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Hardware :: Hardware Drivers",
]
dependencies = [
    "httpx>=0.27",
    "gguf>=0.10",
]

[project.urls]
Homepage = "https://github.com/yalun753/moe-l2"
Source = "https://github.com/yalun753/moe-l2"

[project.optional-dependencies]
predictor = ["sentence-transformers>=3.0"]

[project.scripts]
moe-l2 = "moe_l2.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["moe_l2*"]
exclude = ["moe_l2.bin", "moe_l2.bin.*"]

[tool.setuptools.package-data]
moe_l2 = [
    "data/*.json",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --cov=moe_l2 --cov-report=term-missing:skip-covered --cov-fail-under=50"

[tool.coverage.run]
source = ["moe_l2"]
branch = true
# 排除非运行时核心模块：一次性数据采集脚本（collect）、在线门控
# （gate，需真实 llama-server 流量）、embed-map 命令工具（gguf_embed）、
# 可选语义预测器（semantic_predictor，需 sentence-transformers）。
# 这些在 CI 上不可测或需外部依赖；核心调度链路的覆盖率见报告。
omit = [
    "moe_l2/collect.py",
    "moe_l2/gate.py",
    "moe_l2/gguf_embed.py",
    "moe_l2/semantic_predictor.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = []
